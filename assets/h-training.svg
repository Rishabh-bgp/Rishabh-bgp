<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="86" viewBox="0 0 1000 86" role="img" aria-label="TRAINING LOG: EDUCATION &amp; TRAINING"><defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.2" fill="#000" opacity=".35"/></pattern>
<pattern id="half" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="3.5" cy="3.5" r="1.3" fill="#f2e6cf" opacity=".10"/></pattern>
<pattern id="halfr" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.4" fill="#000" opacity=".28"/></pattern>
<filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="paper"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .95 0 0 0 0 .9 0 0 0 0 .8 0 0 0 .08 0"/></filter>
<linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39ff6a" stop-opacity="0"/><stop offset="1" stop-color="#39ff6a" stop-opacity=".55"/></linearGradient>
</defs><style>
.glA{animation:ga 3.4s infinite}.glB{animation:gb 3.4s infinite}
@keyframes ga{0%,90%,100%{transform:translate(0,0)}92%{transform:translate(-4px,1px)}95%{transform:translate(3px,-1px)}}
@keyframes gb{0%,90%,100%{transform:translate(0,0)}92%{transform:translate(4px,-1px)}95%{transform:translate(-3px,1px)}}
.blink{animation:bl 1.1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.rot{animation:rt 4s linear infinite}@keyframes rt{to{transform:rotate(360deg)}}
.scanline{animation:sl 3s linear infinite}@keyframes sl{from{transform:translateY(-10px)}to{transform:translateY(300px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
