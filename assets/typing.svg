<svg xmlns="http://www.w3.org/2000/svg" width="760" height="44" viewBox="0 0 760 44" role="img" aria-label="Building machine learning that holds up under scrutiny"><style>
.glA{animation:ga 3.4s infinite}.glB{animation:gb 3.4s infinite}
@keyframes ga{0%,90%,100%{transform:translate(0,0)}92%{transform:translate(-4px,1px)}95%{transform:translate(3px,-1px)}}
@keyframes gb{0%,90%,100%{transform:translate(0,0)}92%{transform:translate(4px,-1px)}95%{transform:translate(-3px,1px)}}
.blink{animation:bl 1.1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.rot{animation:rt 4s linear infinite}@keyframes rt{to{transform:rotate(360deg)}}
.scanline{animation:sl 3s linear infinite}@keyframes sl{from{transform:translateY(-10px)}to{transform:translateY(300px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="760" height="44" fill="#0a0a0a"/><rect x="0" y="0" width="8" height="44" fill="#ff0033"/>
<clipPath id="cp"><rect x="20" y="0" height="44" width="0"><animate attributeName="width" values="0;700;700;0;0" keyTimes="0;0.4;0.75;0.88;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
<text x="22" y="29" clip-path="url(#cp)" style="font-family:'Courier New',Consolas,'DejaVu Sans Mono',monospace;font-weight:bold" font-size="19" fill="#00f0ff" filter="url(#g)">&gt; ML that holds up under scrutiny_</text>
<text x="740" y="29" text-anchor="end" style="font-family:'Courier New',Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#39ff6a" class="blink">ONLINE</text>
<defs><filter id="g"><feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs></svg>